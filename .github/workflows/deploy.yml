name: CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 4-Implementation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 4-Implementation/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # 1. each microservice on its own (services/tests): scoring, satellite, advice, PDF, billing, geocode, chatbot, orchestrator
      - run: python -m unittest discover -s services/tests -t services -v
      # 2. the website with the services running in-process (pages, billing flow, admin dashboard, ...)
      - run: python manage.py test
      # 3. the migrations must be up to date
      - run: python manage.py makemigrations --check --dry-run
      # 4. the compose file must be valid (compose refuses to read it when the env_file .env is missing, so use the example)
      - run: cp .env.example .env
      - run: INTERNAL_TOKEN=ci docker compose config -q

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/terrarisk
            git pull origin main
            cd 4-Implementation
            # .env on the server must contain INTERNAL_TOKEN (see .env.example); compose refuses to start without it
            docker compose up -d --build
            docker compose ps
            curl --fail --silent --show-error http://127.0.0.1:8081/healthz/ > /dev/null