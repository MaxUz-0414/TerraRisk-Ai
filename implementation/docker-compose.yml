# TerraRisk AI - microservices.
#
#   internet --> proxy (nginx) --> web (Django: pages, login, admin, database)  --+--> analysis --> satellite, risk, advisory, geocode
#                                                                                 +--> report (PDF) --> satellite
#                                                                                 +--> billing, geocode, chatbot, risk, satellite
#
# Only `proxy` publishes a port. The eight services are reachable only from inside the `backend` network and they
# refuse any request that does not carry INTERNAL_TOKEN.  Start everything:   docker compose up -d --build

x-service: &service
  restart: unless-stopped
  networks: [backend]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-token: &token
  INTERNAL_TOKEN: ${INTERNAL_TOKEN:?Set INTERNAL_TOKEN in .env (any long random text; the services use it to trust each other)}

services:
  # ------------------------------------------------------------------ the website
  web:
    build: .
    env_file: .env
    environment:
      <<: *token
      SERVICES_MODE: http
      POSTGRES_DB: terrarisk
      POSTGRES_HOST: db
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db: {condition: service_healthy}
      analysis: {condition: service_healthy}
      billing: {condition: service_healthy}
      satellite: {condition: service_started}
      risk: {condition: service_started}
      report: {condition: service_started}
      geocode: {condition: service_started}
      chatbot: {condition: service_started}
      advisory: {condition: service_started}
    networks: [edge, backend]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terrarisk
      POSTGRES_USER: ${POSTGRES_USER:-terrarisk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-terrarisk} -d terrarisk"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on: [web]
    networks: [edge]
    restart: unless-stopped

  # ------------------------------------------------------------------ the services (each owns its data)
  analysis:      # orchestrator: one call -> features + score + advice + place name
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: analysis}}
    environment:
      <<: *token
      SATELLITE_URL: http://satellite:8000
      RISK_URL: http://risk:8000
      ADVISORY_URL: http://advisory:8000
      GEOCODE_URL: http://geocode:8000
    depends_on: [satellite, risk, advisory, geocode]
    healthcheck: &health
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 20s

  satellite:     # Earth Engine + Esri imagery: features and pictures
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: satellite}}
    environment:
      <<: *token
      USE_FAKE_DATA: ${USE_FAKE_DATA:-True}
      GEE_PROJECT: ${GEE_PROJECT:-}
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-}
      GEE_KEY_FILE: ${GEE_KEY_FILE:-}          # e.g. /run/secrets/gee-key.json  (file placed in ./secrets/)
      CACHE_DIR: /data/cache
    volumes:
      - satellite_cache:/data
      - ./secrets:/run/secrets:ro
    healthcheck: *health

  risk:          # scoring models and persona views (no state)
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: risk}}
    environment: {<<: *token}
    healthcheck: *health

  advisory:      # written advice (Gemini, with template fallback)
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: advisory}}
    environment:
      <<: *token
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    healthcheck: *health

  report:        # the PDF certificate
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: report}}
    environment:
      <<: *token
      SATELLITE_URL: http://satellite:8000
    depends_on: [satellite]
    healthcheck: *health

  billing:       # accounts, search credits, purchases (own database)
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: billing}}
    environment:
      <<: *token
      BILLING_DB: /data/billing.sqlite3
      FREE_SEARCHES: ${FREE_SEARCHES:-5}
      PAYMENTS_DEMO: ${PAYMENTS_DEMO:-True}
    volumes:
      - billing_data:/data
    healthcheck: *health

  geocode:       # place search / place names / IP -> country (own cache database)
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: geocode}}
    environment:
      <<: *token
      GEOCODE_DB: /data/geocode.sqlite3
      GEOCODE_CONTACT: ${SUPPORT_EMAIL:-support@terrarisk.ai}
    volumes:
      - geocode_data:/data
    healthcheck: *health

  chatbot:       # support chatbot (intent model, optional Gemini)
    <<: *service
    build: {context: ., dockerfile: services/Dockerfile, args: {SERVICE: chatbot}}
    environment:
      <<: *token
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    healthcheck: *health

networks:
  edge: {}      # the internet side: proxy <-> web
  backend: {}   # private: web, database and the eight services (no published ports)

volumes:
  static_data:
  media_data:
  pg_data:
  billing_data:
  geocode_data:
  satellite_cache:
