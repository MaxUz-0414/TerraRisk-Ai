# Keep the original scheme when a proxy such as Cloudflare terminates HTTPS in front of Nginx.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location /static/ { alias /app/staticfiles/; expires 7d; add_header Cache-Control "public"; }
    location /media/  { alias /app/media/; }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        # The real visitor address, for the "where do users sign in from" charts. Behind Cloudflare it arrives as CF-Connecting-IP.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # An analysis can take a while when the services read real satellite data.
        proxy_read_timeout 210s;
    }
}
